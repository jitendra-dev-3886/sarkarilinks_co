name: sarkarilinks
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  environment: &app-env
    APP_NAME: SarkariLinks
    APP_ENV: local
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env}
    APP_URL: ${APP_URL:-http://localhost:8080}
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-sarkarilinks}
    DB_USERNAME: ${DB_USERNAME:-sarkarilinks}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    MAIL_MAILER: log
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [php-fpm]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  php-fpm:
    <<: *app
  queue-worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    restart: unless-stopped
    stop_grace_period: 100s
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sarkarilinks}
      MYSQL_USER: ${DB_USERNAME:-sarkarilinks}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mysql-data:
  redis-data:
